---
# Group `server` — benchmark HAProxy/nginx VM (libvirt + AWS).

libvirt_server:
  hostname: "bench-server"
  mac: "52:54:00:ab:cd:02"
  vcpu: 2
  memory_mib: 4096
  disk_size_gib: 10

aws_server:
  hostname: "bench-server"
  # QAT needs bare metal with Intel QAT; non-QAT smoke uses a small instance (see enable_qat in group_vars/all.yml).
  instance_type: "{{ 'c7i.metal-24xl' if enable_qat | default(false) | bool else 'c7i.large' }}"
  volume:
    size_gib: 30

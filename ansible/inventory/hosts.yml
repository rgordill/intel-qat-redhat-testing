---
# Stub inventory for ansible.cfg (clone without Terraform). Real hosts: run
#   ./scripts/terraform/render-ansible-inventory.sh libvirt   # or aws
# to generate inventory/hosts.auto.yml (gitignored), then either:
#   export QAT_BENCH_INVENTORY=inventory/hosts.auto.yml
#   ansible-playbook -i inventory/hosts.auto.yml playbooks/deploy_benchmark.yml
# Or copy hosts.example.yml to hosts.auto.yml and edit IPs.
#
all:
  vars:
    provider: libvirt
    qatbench_vm_domain: "atik.demo"
    qatbench_client_fqdn: "bench-client.atik.demo"
    qatbench_server_fqdn: "bench-server.atik.demo"
  children:
    client:
      hosts:
        bench-client:
          ansible_host: CHANGE_ME_CLIENT_IP
          ansible_user: cloud-user
    server:
      hosts:
        bench-server:
          ansible_host: CHANGE_ME_SERVER_IP
          ansible_user: cloud-user

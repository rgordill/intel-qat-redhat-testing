---
- name: Compute zone serial (YYYYMMDD + 01)
  ansible.builtin.set_fact:
    bind_zone_serial: "{{ ansible_date_time.date | regex_replace('-', '') }}01"

- name: Install BIND
  ansible.builtin.dnf:
    name: "{{ bind_packages }}"
    state: present

- name: Ensure /var/named/data exists
  ansible.builtin.file:
    path: /var/named/data
    state: directory
    owner: named
    group: named
    mode: "0750"

- name: Deploy authoritative zone file
  ansible.builtin.template:
    src: db.zone.j2
    dest: "/var/named/{{ bind_zone_filename }}"
    owner: named
    group: named
    mode: "0640"
    setype: "{{ 'named_zone_t' if ansible_selinux.status | default('disabled') == 'enabled' else omit }}"
    seuser: "{{ 'system_u' if ansible_selinux.status | default('disabled') == 'enabled' else omit }}"
  notify: Restart named

- name: Deploy named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
    validate: named-checkconf %s
  notify: Restart named

- name: Validate zone file
  ansible.builtin.command:
    argv:
      - named-checkzone
      - "{{ bind_zone_domain }}"
      - "/var/named/{{ bind_zone_filename }}"
  register: bind_named_checkzone
  changed_when: false

- name: Show named-checkzone result
  ansible.builtin.debug:
    msg: "{{ bind_named_checkzone.stdout_lines }}"
  when: bind_named_checkzone.stdout_lines | length > 0

- name: Gather service facts (for firewalld state)
  ansible.builtin.service_facts:
  when: bind_manage_firewalld | bool

- name: Allow DNS through firewalld (permanent and runtime)
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled
  when:
    - bind_manage_firewalld | bool
    - (ansible_facts.services | default({})).get('firewalld.service', {}).get('state', 'inactive') == 'running'

- name: Enable and start named
  ansible.builtin.systemd:
    name: "{{ bind_service }}"
    state: started
    enabled: true

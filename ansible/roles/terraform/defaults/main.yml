---
# create | destroy — set by the calling playbook (infra_create.yml / infra_destroy.yml)
terraform_action: create

# Which Terraform stack to apply: libvirt | aws
qatbench_provider: libvirt

qatbench_libvirt_project_path: "{{ playbook_dir }}/../../terraform/libvirt"
qatbench_aws_project_path: "{{ playbook_dir }}/../../terraform/aws"
